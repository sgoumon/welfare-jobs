name: Update job listings

on:
  schedule:
    - cron: "17 5 * * *"     # every day at 05:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_jobs.py

      - name: Commit updated listings
        run: |
          git config user.name  "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/*.json
          git diff --cached --quiet || git commit -m "Update job listings $(date -u +%F)"
          git push
